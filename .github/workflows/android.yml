name: Android CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: write

env:
  # Major.minor of the app version; the patch number is the commit count.
  VERSION_BASE: "1.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compute version
        id: version
        run: echo "name=${VERSION_BASE}.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug -PappVersion=${{ steps.version.outputs.name }} --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: media-player-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Decode release keystore
        id: keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets configured; the release APK will be unsigned."
          fi

      - name: Build release APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PappVersion=${{ steps.version.outputs.name }} --stacktrace

      - uses: actions/upload-artifact@v4
        if: steps.keystore.outputs.path != ''
        with:
          name: media-player-release
          path: app/build/outputs/apk/release/*.apk

      - name: Lint
        run: ./gradlew lintDebug

      # Every push to the default branch becomes a GitHub Release, which the in-app updater reads.
      - name: Prepare release APK
        if: >-
          github.event_name == 'push' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          steps.keystore.outputs.path != ''
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/MediaPlayer-${{ steps.version.outputs.name }}.apk"

      - name: Publish GitHub Release
        if: >-
          github.event_name == 'push' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          steps.keystore.outputs.path != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: dist/*.apk
          generate_release_notes: true
          make_latest: true
